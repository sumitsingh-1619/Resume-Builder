<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResuTech Pro — Student & Tech Official Resume Builder</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --resume-accent: #1d4ed8;
            --resume-font: 'Inter', sans-serif;
            --resume-scale: 1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* A4 Paper Dimensions & Styling */
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
            color: #111827;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            font-family: var(--resume-font);
            transform-origin: top center;
            transition: transform 0.15s ease;
            box-sizing: border-box;
            position: relative;
        }

        /* Template Specific Typographic Adjustments */
        .font-inter { --resume-font: 'Inter', sans-serif; }
        .font-serif-academic { --resume-font: 'Merriweather', Georgia, serif; }
        .font-roboto { --resume-font: 'Roboto', sans-serif; }

        /* Template 1: Jake's Classic Tech (Single Column ATS Standard) */
        .tpl-jakes {
            padding: 12mm 14mm;
            line-height: 1.32;
        }
        .tpl-jakes .sec-title {
            font-size: 10.5pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1.5px solid #111827;
            padding-bottom: 2px;
            margin-top: 10px;
            margin-bottom: 6px;
            color: #111827;
        }

        /* Template 2: Modern Executive (Clean Accent) */
        .tpl-executive {
            padding: 14mm 16mm;
            line-height: 1.38;
        }
        .tpl-executive .sec-title {
            font-size: 11pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--resume-accent);
            border-bottom: 2px solid var(--resume-accent);
            padding-bottom: 3px;
            margin-top: 12px;
            margin-bottom: 7px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Template 3: Compact Academic/Student (Dense IIT/NIT style) */
        .tpl-compact {
            padding: 10mm 12mm;
            line-height: 1.25;
        }
        .tpl-compact .sec-title {
            font-size: 10pt;
            font-weight: 700;
            text-transform: uppercase;
            background-color: #f1f5f9;
            border-left: 3.5px solid var(--resume-accent);
            padding: 2px 6px;
            margin-top: 8px;
            margin-bottom: 5px;
            color: #0f172a;
        }

        /* Bullet list formatting inside resume */
        .resume-bullets {
            list-style-type: disc;
            padding-left: 1.15rem;
            margin-top: 2px;
        }
        .resume-bullets li {
            font-size: 9.2pt;
            margin-bottom: 2px;
            color: #1f2937;
        }

        /* Print Media Query - CRITICAL for clean PDF export */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            html, body {
                background: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
                height: auto !important;
                overflow: visible !important;
            }
            .no-print {
                display: none !important;
            }
            #preview-viewport {
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
                display: block !important;
                width: 100% !important;
                height: auto !important;
                background: transparent !important;
            }
            #resume-sheet {
                box-shadow: none !important;
                margin: 0 !important;
                width: 210mm !important;
                min-height: 297mm !important;
                transform: none !important;
                page-break-after: always;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

    <!-- TOP NAVIGATION & MODE BAR -->

                    <i class="fa-solid fa-user-graduate"></i>
                    <span>College Student / Fresher</span>
                </button>
                <button id="mode-official-btn" onclick="switchProfileMode('official')" class="px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1.5 text-slate-300 hover:text-white">
                    <i class="fa-solid fa-user-tie"></i>
                    <span>Tech Official / Experienced</span>
                </button>
            </div>
        </div>

        <!-- Sample Loaders & Export Actions -->
        <div class="flex items-center gap-2 flex-wrap">
            <div class="flex items-center bg-slate-800/70 rounded-lg p-1 border border-slate-700/60 text-xs">
                <span class="text-slate-400 px-2 font-medium hidden xl:inline">Quick Demo:</span>
                <button onclick="loadSampleData('student')" class="px-2.5 py-1 rounded-md hover:bg-slate-700 text-emerald-400 font-medium transition flex items-center gap-1.5" title="Load B.Tech CSE Student Sample">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Student Sample
                </button>
                <div class="h-3 w-[1px] bg-slate-700 mx-1"></div>
                <button onclick="loadSampleData('official')" class="px-2.5 py-1 rounded-md hover:bg-slate-700 text-amber-400 font-medium transition flex items-center gap-1.5" title="Load Principal Architect / VP Eng Sample">
                    <i class="fa-solid fa-bolt"></i> Tech Official Sample
                </button>
            </div>

            <!-- JSON Import/Export -->
            <button onclick="exportResumeJSON()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition flex items-center gap-1.5" title="Save Backup JSON">
                <i class="fa-solid fa-download text-slate-400"></i> <span class="hidden md:inline">JSON</span>
            </button>
            <label class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition flex items-center gap-1.5 cursor-pointer" title="Restore from JSON">

                <input type="file" id="json-import-input" accept=".json" class="hidden" onchange="importResumeJSON(event)">
            </label>

            <!-- Primary Print / PDF CTA -->
            <button onclick="triggerPrintPDF()" class="px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-xs shadow-lg shadow-blue-600/25 transition flex items-center gap-2">
                <i class="fa-solid fa-file-pdf"></i>
                <span>Export / Print A4 PDF</span>
            </button>
        </div>
    </header>

    <!-- MOBILE VIEW SWITCHER (Only visible on < lg screens) -->

            </button>
        </div>
    </div>

    <!-- MAIN SPLIT WORKSPACE -->

                    </div>
                </div>

                </button>
                <button onclick="switchEditorTab('education')" data-tab="education" class="editor-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition flex items-center gap-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800">

                <button onclick="switchEditorTab('achievements')" data-tab="achievements" class="editor-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition flex items-center gap-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800">
                    <i class="fa-solid fa-trophy"></i> Achievements & Certs

        function adjustZoom(delta) {
            currentZoom = Math.min(1.15, Math.max(0.45, currentZoom + delta));
            applyZoom();
        }

        function autoFitPreviewZoom() {
            const viewport = document.getElementById('preview-viewport');
            if (!viewport) return;
            const availableWidth = viewport.clientWidth - 48;
            const a4PixelWidth = 794; // 210mm at 96dpi
            if (availableWidth > 300 && availableWidth < a4PixelWidth) {
                currentZoom = Math.max(0.42, +(availableWidth / a4PixelWidth).toFixed(2));
            } else if (availableWidth >= a4PixelWidth) {
                currentZoom = Math.min(0.92, +(availableWidth / (a4PixelWidth + 80)).toFixed(2));
            }
            applyZoom();
        }

        function applyZoom() {
            const sheet = document.getElementById('resume-sheet');
            const label = document.getElementById('zoom-label');
            if (sheet) {
                sheet.style.transform = `scale(${currentZoom})`;
                sheet.style.marginBottom = `${(currentZoom - 1) * 1122}px`;
            }
            if (label) {
                label.textContent = `${Math.round(currentZoom * 100)}%`;
            }
        }

        function moveArrayItem(section, index, direction) {
            const arr = resumeState[section];
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= arr.length) return;
            const temp = arr[index];
            arr[index] = arr[newIndex];
            arr[newIndex] = temp;
            renderEditorForm();
            onStateUpdated();

            resumeState[section].splice(index, 1);

        function formatSmartText(str) {
            if (!str) return '';
            // Highlight percentages, latency metrics, multipliers, currency, and ratings subtly
            const safe = escapeHTML(str);
            return safe.replace(/(\b\d+(?:\.\d+)?%|\b\d+(?:,\d+)+\+?|\$\d+(?:\.\d+)?[BMK]\+?|\b\d+(?:\.\d+)?x\b|\b99\.9+\d*%\b)/g, '<strong class="font-semibold text-gray-900">$1</strong>');
        }

            const isExecTpl = resumeState.template === 'executive';
            const isCompactTpl = resumeState.template === 'compact';

            const contactItems = [];
            if (p.phone) contactItems.push(`<span><i class="fa-solid fa-phone text-[8pt] mr-1 opacity-75"></i>${escapeHTML(p.phone)}</span>`);
            if (p.email) contactItems.push(`<a href="mailto:${escapeHTML(p.email)}" class="hover:underline"><i class="fa-solid fa-envelope text-[8pt] mr-1 opacity-75"></i>${escapeHTML(p.email)}</a>`);
            if (p.location) contactItems.push(`<span><i class="fa-solid fa-location-dot text-[8pt] mr-1 opacity-75"></i>${escapeHTML(p.location)}</span>`);
            if (p.linkedin) contactItems.push(`<a href="https://${escapeHTML(p.linkedin.replace(/^https?:\/\//,''))}" target="_blank" class="hover:underline"><i class="fa-brands fa-linkedin text-[8.5pt] mr-1 opacity-80"></i>${escapeHTML(p.linkedin)}</a>`);
            if (p.github) contactItems.push(`<a href="https://${escapeHTML(p.github.replace(/^https?:\/\//,''))}" target="_blank" class="hover:underline"><i class="fa-brands fa-github text-[8.5pt] mr-1 opacity-80"></i>${escapeHTML(p.github)}</a>`);
            if (p.portfolio) contactItems.push(`<a href="https://${escapeHTML(p.portfolio.replace(/^https?:\/\//,''))}" target="_blank" class="hover:underline"><i class="fa-solid fa-globe text-[8pt] mr-1 opacity-75"></i>${escapeHTML(p.portfolio)}</a>`);

            let headerHTML = '';
            if (isExecTpl) {
                headerHTML = `
                    <header class="border-b-2 pb-2.5 mb-2" style="border-color: var(--resume-accent)">
                        <div class="flex justify-between items-baseline flex-wrap gap-2">
                            <h1 class="text-[20pt] font-bold tracking-tight uppercase" style="color: var(--resume-accent)">${escapeHTML(p.fullName || 'YOUR NAME')}</h1>
                            ${p.codingProfile ? `<span class="text-[8.5pt] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-800 border border-slate-300">${escapeHTML(p.codingProfile)}</span>` : ''}
                        </div>
                        ${p.headline ? `<p class="text-[10pt] font-semibold text-gray-800 mt-0.5">${escapeHTML(p.headline)}</p>` : ''}
                        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-[8.8pt] text-gray-700 mt-1.5">
                            ${contactItems.join('<span class="text-gray-300">•</span>')}
                        </div>
                    </header>
                `;
            } else if (isCompactTpl) {
                headerHTML = `
                    <header class="border-b border-gray-800 pb-1.5 mb-1.5 flex justify-between items-end flex-wrap gap-2">
                        <div>
                            <h1 class="text-[17pt] font-bold tracking-tight text-gray-900 uppercase leading-none">${escapeHTML(p.fullName || 'YOUR NAME')}</h1>
                            ${p.headline ? `<p class="text-[9pt] font-medium text-gray-700 mt-1">${escapeHTML(p.headline)}</p>` : ''}
                            ${p.codingProfile ? `<p class="text-[8.5pt] font-semibold mt-0.5" style="color: var(--resume-accent)">${escapeHTML(p.codingProfile)}</p>` : ''}
                        </div>
                        <div class="text-right text-[8.3pt] text-gray-700 space-y-0.5 max-w-[55%]">
                            <div class="flex flex-wrap justify-end gap-x-2.5 gap-y-0.5">
                                ${contactItems.join('<span class="text-gray-400">|</span>')}
                            </div>
                        </div>
                    </header>
                `;
            } else {
                // Default: Jake's Classic Tech (Centered Single-Column ATS Standard)
                headerHTML = `
                    <header class="text-center mb-2">
                        <h1 class="text-[19pt] font-bold tracking-tight text-gray-900 uppercase">${escapeHTML(p.fullName || 'YOUR NAME')}</h1>
                        ${p.headline ? `<p class="text-[9.3pt] font-medium text-gray-700 mt-0.5">${escapeHTML(p.headline)}</p>` : ''}
                        <div class="flex flex-wrap justify-center items-center gap-x-2.5 gap-y-0.5 text-[8.7pt] text-gray-800 mt-1">
                            ${contactItems.join('<span class="text-gray-400">|</span>')}
                        </div>
                        ${p.codingProfile ? `<div class="text-[8.6pt] font-semibold text-gray-900 mt-0.5">${escapeHTML(p.codingProfile)}</div>` : ''}
                    </header>
                `;
            }

            // 2. Section Renderers Map
            const sectionRenderers = {
                summary: () => {
                    if (!p.summary || !p.summary.trim()) return '';
                    return `
                        <section>
                            <h2 class="sec-title">${resumeState.mode === 'official' ? 'Executive Summary' : 'Profile Summary'}</h2>
                            <p class="text-[9.2pt] text-gray-800 leading-snug">${formatSmartText(p.summary)}</p>
                        </section>
                    `;
                },

                education: () => {
                    if (!resumeState.education || resumeState.education.length === 0) return '';
                    const itemsHTML = resumeState.education.map(edu => `
                        <div class="mb-1.5 last:mb-0">
                            <div class="flex justify-between items-baseline">
                                <span class="text-[9.8pt] font-bold text-gray-900">${escapeHTML(edu.institution)}</span>
                                <span class="text-[8.8pt] font-medium text-gray-800 shrink-0">${escapeHTML(edu.duration)}</span>
                            </div>
                            <div class="flex justify-between items-baseline text-[9.1pt]">
                                <span class="italic text-gray-800">${escapeHTML(edu.degree)} ${edu.score ? `<strong class="not-italic font-semibold text-gray-900 ml-1">(${escapeHTML(edu.score)})</strong>` : ''}</span>
                                <span class="text-[8.5pt] italic text-gray-600 shrink-0">${escapeHTML(edu.location)}</span>
                            </div>
                            ${edu.coursework ? `<div class="text-[8.5pt] text-gray-700 mt-0.5"><strong class="font-semibold text-gray-800">Relevant Detail:</strong> ${escapeHTML(edu.coursework)}</div>` : ''}
                        </div>
                    `).join('');

                    return `
                        <section>
                            <h2 class="sec-title">Education</h2>
                            ${itemsHTML}
                        </section>
                    `;
                },

                skills: () => {
                    const s = resumeState.skills;
                    if (!s) return '';
                    const rows = [];
                    if (s.languages) rows.push(`<div><strong class="font-bold text-gray-900">Languages:</strong> <span>${escapeHTML(s.languages)}</span></div>`);
                    if (s.frameworks) rows.push(`<div><strong class="font-bold text-gray-900">Frameworks & Databases:</strong> <span>${escapeHTML(s.frameworks)}</span></div>`);
                    if (s.cloudDevops) rows.push(`<div><strong class="font-bold text-gray-900">Cloud, DevOps & Tools:</strong> <span>${escapeHTML(s.cloudDevops)}</span></div>`);
                    if (s.coreSystems) rows.push(`<div><strong class="font-bold text-gray-900">${resumeState.mode === 'student' ? 'Core CS & Systems' : 'Architecture & Leadership'}:</strong> <span>${escapeHTML(s.coreSystems)}</span></div>`);
                    if (s.codingProfiles) rows.push(`<div><strong class="font-bold text-gray-900">${resumeState.mode === 'student' ? 'Coding Profiles' : 'Patents & Credentials'}:</strong> <span>${formatSmartText(s.codingProfiles)}</span></div>`);

                    if (rows.length === 0) return '';
                    return `
                        <section>
                            <h2 class="sec-title">${resumeState.mode === 'student' ? 'Technical Skills & Coding Profiles' : 'Core Technical Competencies & Architecture'}</h2>
                            <div class="text-[9.1pt] text-gray-800 space-y-0.5">
                                ${rows.join('')}
                            </div>
                        </section>
                    `;
                },

                experience: () => {
                    if (!resumeState.experience || resumeState.experience.length === 0) return '';
                    const itemsHTML = resumeState.experience.map(exp => {
                        const bulletsHTML = (exp.bullets || []).map(b => `<li>${formatSmartText(b)}</li>`).join('');
                        return `
                            <div class="mb-2 last:mb-0">
                                <div class="flex justify-between items-baseline">
                                    <div>
                                        <span class="text-[9.8pt] font-bold text-gray-900">${escapeHTML(exp.role)}</span>
                                        <span class="text-[9.5pt] font-semibold text-gray-800"> — ${escapeHTML(exp.company)}</span>
                                    </div>
                                    <span class="text-[8.8pt] font-medium text-gray-800 shrink-0">${escapeHTML(exp.duration)}</span>
                                </div>
                                <div class="flex justify-between items-baseline text-[8.6pt] italic text-gray-700">
                                    <span>${exp.techStack ? `<strong class="not-italic font-semibold text-gray-800">Stack:</strong> ${escapeHTML(exp.techStack)}` : ''}</span>
                                    <span>${escapeHTML(exp.location)}</span>
                                </div>
                                ${bulletsHTML ? `<ul class="resume-bullets">${bulletsHTML}</ul>` : ''}
                            </div>
                        `;
                    }).join('');

                    return `
                        <section>
                            <h2 class="sec-title">${resumeState.mode === 'student' ? 'Experience & Internships' : 'Professional Experience & Executive Impact'}</h2>
                            ${itemsHTML}
                        </section>
                    `;
                },

                projects: () => {
                    if (!resumeState.projects || resumeState.projects.length === 0) return '';
                    const itemsHTML = resumeState.projects.map(proj => {
                        const bulletsHTML = (proj.bullets || []).map(b => `<li>${formatSmartText(b)}</li>`).join('');
                        const links = [];
                        if (proj.githubLink) links.push(`<a href="https://${escapeHTML(proj.githubLink.replace(/^https?:\/\//,''))}" target="_blank" class="underline font-medium text-gray-800">GitHub: ${escapeHTML(proj.githubLink.replace(/^https?:\/\/(www\.)?github\.com\//,''))}</a>`);
                        if (proj.liveLink) links.push(`<a href="https://${escapeHTML(proj.liveLink.replace(/^https?:\/\//,''))}" target="_blank" class="underline font-medium text-gray-800">Live: ${escapeHTML(proj.liveLink)}</a>`);

                        return `
                            <div class="mb-2 last:mb-0">
                                <div class="flex justify-between items-baseline gap-2">
                                    <div class="text-[9.5pt]">
                                        <span class="font-bold text-gray-900">${escapeHTML(proj.title)}</span>
                                        ${proj.techStack ? `<span class="text-[8.7pt] italic text-gray-700"> | ${escapeHTML(proj.techStack)}</span>` : ''}
                                        ${links.length ? `<span class="text-[8.3pt] ml-1.5">[${links.join(' | ')}]</span>` : ''}
                                    </div>
                                    <span class="text-[8.7pt] font-medium text-gray-800 shrink-0">${escapeHTML(proj.duration)}</span>
                                </div>
                                ${bulletsHTML ? `<ul class="resume-bullets">${bulletsHTML}</ul>` : ''}
                            </div>
                        `;
                    }).join('');

                    return `
                        <section>
                            <h2 class="sec-title">${resumeState.mode === 'student' ? 'Technical Projects' : 'Key System Architectures & Open Source'}</h2>
                            ${itemsHTML}
                        </section>
                    `;
                },

                achievements: () => {
                    if (!resumeState.achievements || resumeState.achievements.length === 0) return '';
                    const bulletsHTML = resumeState.achievements.map(a => `<li>${formatSmartText(a)}</li>`).join('');
                    return `
                        <section>
                            <h2 class="sec-title">${resumeState.mode === 'student' ? 'Achievements, Hackathons & Leadership' : 'Patents, Certifications & Honors'}</h2>
                            <ul class="resume-bullets">${bulletsHTML}</ul>
                        </section>
                    `;
                }
            };

            // 3. Assemble Sections According to User's Custom Order
            let bodyHTML = '';
            const renderedKeys = new Set();

            // If in official mode and summary isn't in sectionOrder yet, prepend it
            if (resumeState.mode === 'official' && !resumeState.sectionOrder.includes('summary')) {
                resumeState.sectionOrder.unshift('summary');
            }

            resumeState.sectionOrder.forEach(secKey => {
                if (sectionRenderers[secKey] && !renderedKeys.has(secKey)) {
                    bodyHTML += sectionRenderers[secKey]();
                    renderedKeys.add(secKey);
                }
            });

            sheet.innerHTML = headerHTML + bodyHTML;
        }

        /********************************************************************
         * 8. REAL-TIME ATS READABILITY & IMPACT ANALYZER
         ********************************************************************/
        function calculateATSScore() {
            const checks = [];
            let totalScore = 0;

            // 1. Contact & Profile Links (15 pts)
            const p = resumeState.personal;
            const hasCoreContact = Boolean(p.fullName && p.email && p.phone);
            const hasTechLinks = Boolean(p.github || p.linkedin);
            if (hasCoreContact && hasTechLinks) {
                totalScore += 15;
                checks.push({ pass: true, title: "Complete Contact & Developer Links (+15)", desc: "Email, Phone, LinkedIn, and GitHub links detected for recruiter verification." });
            } else {
                totalScore += hasCoreContact ? 8 : 3;
                checks.push({ pass: false, title: "Missing Tech Profile Links (+7 potential)", desc: "Ensure both LinkedIn and GitHub URLs are filled in Personal Info." });
            }

            // 2. Categorized Technical Skills (20 pts)
            const s = resumeState.skills;
            const skillCategoriesCount = [s.languages, s.frameworks, s.cloudDevops, s.coreSystems].filter(v => v && v.trim().length > 3).length;
            if (skillCategoriesCount >= 3) {
                totalScore += 20;
                checks.push({ pass: true, title: "Structured ATS Skill Taxonomy (+20)", desc: `${skillCategoriesCount} distinct technical skill categories populated.` });
            } else {
                totalScore += skillCategoriesCount * 5;
                checks.push({ pass: false, title: "Expand Technical Skill Categories", desc: "Populate Languages, Frameworks, Cloud/DevOps, and Core CS for keyword matching." });
            }

            // 3. Quantified Impact Metrics (%, latency, scale numbers) (25 pts)
            const allBullets = [
                ...(resumeState.experience || []).flatMap(e => e.bullets || []),
                ...(resumeState.projects || []).flatMap(pr => pr.bullets || []),
                ...(resumeState.achievements || [])
            ];
            const metricRegex = /(\d+(?:\.\d+)?%|\d+(?:,\d+)+\+?|\$\d+|\d+x\b|\d+\s*(?:ms|sec|TPS|RPS|users|nodes|stars))/i;
            const quantifiedBullets = allBullets.filter(b => metricRegex.test(b));

            if (quantifiedBullets.length >= 4) {
                totalScore += 25;
                checks.push({ pass: true, title: `Strong Quantified Impact (${quantifiedBullets.length} metrics found) (+25)`, desc: "Bullets effectively use %, latency reductions, scale, or rankings." });
            } else {
                const pts = quantifiedBullets.length * 6;
                totalScore += pts;
                checks.push({ pass: false, title: `Add More Quantified Metrics (${quantifiedBullets.length}/4 minimum)`, desc: "Include concrete numbers (e.g., 'cut latency by 40%', '15,000 req/s', 'CGPA 9.1')." });
            }

            // 4. Strong Action Verbs (20 pts)
            let actionVerbCount = 0;
            allBullets.forEach(b => {
                const firstWord = b.trim().split(/\s+/)[0]?.toLowerCase().replace(/[^a-z]/g, '');
                if (STRONG_ACTION_VERBS.includes(firstWord)) actionVerbCount++;
            });

            if (actionVerbCount >= 4) {
                totalScore += 20;
                checks.push({ pass: true, title: `High-Impact Action Verbs (${actionVerbCount} bullets) (+20)`, desc: "Bullets lead with engineering verbs like Engineered, Architected, Optimized." });
            } else {
                totalScore += Math.min(15, actionVerbCount * 4);
                checks.push({ pass: false, title: "Start Bullets with Strong Action Verbs", desc: "Begin points with words like Engineered, Architected, Spearheaded, or Reduced." });
            }

            // 5. Mode-Specific Completeness Check (20 pts)
            if (resumeState.mode === 'student') {
                const hasEdu = resumeState.education && resumeState.education.length > 0;
                const hasProj = resumeState.projects && resumeState.projects.length >= 2;
                if (hasEdu && hasProj) {
                    totalScore += 20;
                    checks.push({ pass: true, title: "Student Mode Readiness (+20)", desc: "Education with CGPA/Score and 2+ technical projects with tech stacks verified." });
                } else {
                    totalScore += 10;
                    checks.push({ pass: false, title: "Student Mode Completeness", desc: "Add at least 2 technical projects with GitHub links and complete Education details." });
                }
            } else {
                const hasSummary = p.summary && p.summary.trim().length > 40;
                const hasExp = resumeState.experience && resumeState.experience.length >= 2;
                if (hasSummary && hasExp) {
                    totalScore += 20;
                    checks.push({ pass: true, title: "Tech Official Executive Readiness (+20)", desc: "Executive summary and multi-role leadership/architecture experience verified." });
                } else {
                    totalScore += 10;
                    checks.push({ pass: false, title: "Tech Official Completeness", desc: "Include an Executive Summary and at least 2 detailed work experience entries." });
                }
            }

            totalScore = Math.min(100, Math.max(10, totalScore));

            // Update UI Indicator
            const scoreVal = document.getElementById('ats-score-val');
            const badge = document.getElementById('ats-badge');
            const ring = document.getElementById('ats-score-ring');
            const feedback = document.getElementById('ats-feedback-text');

            if (scoreVal) scoreVal.textContent = `${totalScore}%`;

            if (totalScore >= 85) {
                ring.className = "relative w-11 h-11 rounded-full bg-slate-900 border-2 border-emerald-500 flex items-center justify-center shrink-0";
                scoreVal.className = "text-xs font-bold text-emerald-400";
                badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 font-medium";
                badge.textContent = "ATS Optimized";
            } else if (totalScore >= 65) {
                ring.className = "relative w-11 h-11 rounded-full bg-slate-900 border-2 border-amber-500 flex items-center justify-center shrink-0";
                scoreVal.className = "text-xs font-bold text-amber-400";
                badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-400 font-medium";
                badge.textContent = "Good — Can Improve";
            } else {
                ring.className = "relative w-11 h-11 rounded-full bg-slate-900 border-2 border-rose-500 flex items-center justify-center shrink-0";
                scoreVal.className = "text-xs font-bold text-rose-400";
                badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-rose-500/15 text-rose-400 font-medium";
                badge.textContent = "Needs Attention";
            }

            const failedCheck = checks.find(c => !c.pass);
            if (feedback) {
                feedback.textContent = failedCheck
                    ? `Tip: ${failedCheck.desc}`
                    : `All ${checks.length} ATS parser & quantified impact checks passed!`;
            }

            // Populate Audit Modal
            const modalBody = document.getElementById('ats-modal-body');
            if (modalBody) {
                modalBody.innerHTML = checks.map(c => `
                    <div class="p-3 rounded-xl border ${c.pass ? 'bg-emerald-950/20 border-emerald-800/50' : 'bg-amber-950/20 border-amber-800/50'} flex items-start gap-3">
                        <i class="fa-solid ${c.pass ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-amber-400'} mt-0.5"></i>
                        <div>
                            <div class="font-semibold text-white">${c.title}</div>
                            <div class="text-slate-400 mt-0.5">${c.desc}</div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function toggleATSModal() {
            const modal = document.getElementById('ats-modal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        /********************************************************************
         * 9. EXPORT TO PDF & JSON PERSISTENCE
         ********************************************************************/
        function triggerPrintPDF() {
            // Ensure preview panel is visible on mobile before printing
            const previewPanel = document.getElementById('preview-panel');
            const wasHidden = previewPanel.classList.contains('hidden');
            if (wasHidden) {
                previewPanel.classList.remove('hidden');
            }
            window.print();
            if (wasHidden) {
                previewPanel.classList.add('hidden');
            }
        }

        function exportResumeJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(resumeState, null, 2));
            const dlAnchor = document.createElement('a');
            const safeName = (resumeState.personal.fullName || 'resume').toLowerCase().replace(/\s+/g, '_');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `${safeName}_resutech_${resumeState.mode}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast("Exported Resume JSON backup!");
        }

        function importResumeJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && parsed.personal) {
                        resumeState = parsed;
                        syncUIWithState();
                        renderEditorForm();
                        renderResumePreview();
                        calculateATSScore();
                        saveState();
                        showToast("Imported Resume JSON successfully!");
                    } else {
                        showToast("Invalid Resume JSON structure", "fa-circle-exclamation text-rose-400");
                    }
                } catch (err) {
                    showToast("Error parsing JSON file", "fa-circle-exclamation text-rose-400");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
    </script>
